name: Transport Renaissance native checkpoint
on:
  workflow_dispatch:
  push:
    branches: [main, codex/renaissance-first-playable]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: TransportRenaissance
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Bootstrap pinned dependencies
        run: ./TransportRenaissance/tools/renaissance/bootstrap.ps1
      - name: Build and test the game
        run: ./TransportRenaissance/tools/renaissance/build.ps1
      - name: Verify optional regional gameplay and save compatibility
        run: ./tools/python/Scripts/python.exe TransportRenaissance/tools/renaissance/verify_regional.py
      - name: Build and test the dedicated server
        run: ./TransportRenaissance/tools/renaissance/build.ps1 -Dedicated
      - name: Package binary with corresponding source
        run: ./tools/python/Scripts/python.exe TransportRenaissance/tools/renaissance/package.py
      - uses: actions/upload-artifact@v5
        with:
          name: renaissance-windows-source-complete
          path: artifacts/release/*.zip*
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: regional-simulation-evidence
          path: |
            artifacts/regional-verification/results.json
            artifacts/regional-verification/**/*.log
            artifacts/regional-verification/stress/results.json
